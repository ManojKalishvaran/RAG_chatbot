<!DOCTYPE html>
<html>
<head>
    <title>Modern RAG Chat System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-light: #818CF8;
            --success: #10B981;
            --error: #EF4444;
            --background: #F3F4F6;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --text-light: #6B7280;
            --border: #E5E7EB;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.5;
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: var(--primary);
            text-align: center;
        }

        .card {
            background: var(--card-bg);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text);
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 0.75rem;
            padding: 2rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.05);
        }

        input[type="file"] {
            display: none;
        }

        .upload-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--primary);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-button:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
        }

        #chat-container {
            display: none;
        }

        #chat-history {
            height: 500px;
            overflow-y: auto;
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            background: var(--background);
        }

        .message {
            margin-bottom: 1rem;
            padding: 1rem;
            border-radius: 0.5rem;
            max-width: 80%;
            position: relative;
        }

        .user-message {
            background: var(--primary);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 0;
        }

        .bot-message {
            background: white;
            border: 1px solid var(--border);
            margin-right: auto;
            border-bottom-left-radius: 0;
        }

        .input-area {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        #question {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        #question:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .send-button {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .send-button:hover {
            background: var(--primary-light);
        }

        #loading {
            display: none;
            color: var(--text-light);
            margin: 1rem 0;
            text-align: center;
        }

        .error {
            color: var(--error);
            background: rgba(239, 68, 68, 0.1);
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin: 0.75rem 0;
        }

        .success {
            color: var(--success);
            background: rgba(16, 185, 129, 0.1);
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin: 0.75rem 0;
        }

        .file-info {
            margin-top: 1rem;
            color: var(--text-light);
            font-size: 0.875rem;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--background);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 3px;
        }

        .typing-indicator {
            display: flex;
            gap: 0.5rem;
            padding: 1rem;
            color: var(--text-light);
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Modern Chat Assistant</h1>
        
        <div class="card">
            <h2>Upload Your Document</h2>
            <div class="upload-area">
                <label class="upload-button">
                    <i class="fas fa-file-upload"></i>
                    Choose PDF File
                    <input type="file" id="pdf-file" accept=".pdf">
                </label>
                <div class="file-info" id="selected-file-name">No file selected</div>
            </div>
            <div id="loading">
                <div class="typing-indicator">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                Processing your document...
            </div>
            <div id="upload-status"></div>
        </div>

        <div id="chat-container" class="card">
            <h2>Chat Interface</h2>
            <div id="chat-history"></div>
            <div class="input-area">
                <input type="text" id="question" placeholder="Type your question here...">
                <button class="send-button" onclick="askQuestion()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('pdf-file').addEventListener('change', function(e) {
            const fileName = e.target.files[0]?.name || 'No file selected';
            document.getElementById('selected-file-name').textContent = fileName;
        });

        async function uploadFile() {
            const fileInput = document.getElementById('pdf-file');
            const loadingDiv = document.getElementById('loading');
            const statusDiv = document.getElementById('upload-status');
            const file = fileInput.files[0];
            
            statusDiv.innerHTML = '';
            
            if (!file) {
                statusDiv.innerHTML = '<div class="error">Please select a file</div>';
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                loadingDiv.style.display = 'block';
                
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    statusDiv.innerHTML = '<div class="success">File processed successfully</div>';
                    document.getElementById('chat-container').style.display = 'block';
                } else {
                    statusDiv.innerHTML = `<div class="error">${data.error}</div>`;
                }
            } catch (error) {
                statusDiv.innerHTML = `<div class="error">${error.message}</div>`;
            } finally {
                loadingDiv.style.display = 'none';
            }
        }

        async function askQuestion() {
            const questionInput = document.getElementById('question');
            const question = questionInput.value.trim();
            
            if (!question) return;

            addMessage(question, 'user');
            questionInput.value = '';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question })
                });
                const data = await response.json();
                
                if (response.ok) {
                    addMessage(data.answer, 'bot');
                } else {
                    addMessage(`Error: ${data.error}`, 'bot');
                }
            } catch (error) {
                addMessage(`Error: ${error.message}`, 'bot');
            }
        }

        function addMessage(message, sender) {
            const chatHistory = document.getElementById('chat-history');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            messageDiv.textContent = message;
            chatHistory.appendChild(messageDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        document.getElementById('question').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                askQuestion();
            }
        });

        // Auto-trigger file upload when file is selected
        document.getElementById('pdf-file').addEventListener('change', uploadFile);
    </script>
</body>
</html>
